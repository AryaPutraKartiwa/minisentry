name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[server,dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e ".[server,dev]"
      - run: pytest

  integration:
    # Same code paths as production: real Redis Streams and real Postgres upserts.
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minisentry
          POSTGRES_PASSWORD: minisentry
          POSTGRES_DB: minisentry
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minisentry" --health-interval 2s --health-retries 15
    env:
      MINISENTRY_TEST_REDIS_URL: redis://localhost:6379/0
      MINISENTRY_TEST_DATABASE_URL: postgresql+psycopg://minisentry:minisentry@localhost:5432/minisentry
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[server,dev]"
      - run: pytest -m integration -v
